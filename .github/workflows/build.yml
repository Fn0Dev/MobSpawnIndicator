name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gradle (and Loom) must run on JDK 25+; per-node toolchains (21/25) are
      # provisioned automatically by the foojay resolver in settings.gradle.kts.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build all targets
        run: ./gradlew build --stacktrace

      - name: Collect jars
        run: |
          mkdir -p dist
          find versions -path "*/build/libs/*.jar" ! -name "*-sources.jar" -exec cp {} dist/ \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mod-jars
          path: dist/*.jar
